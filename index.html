<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Star Trace 串流認證助手</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;800&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
/* Layout: one narrow "pit board" column — clock strip on top, then hour board, image maker, reply text, rules */
:root{
  --bg:#EEF1F6; --panel:#FFFFFF; --ink:#111733; --muted:#5B6382; --line:#D7DCE8;
  --accent:#2B4EF0; --accent-ink:#FFFFFF; --done:#11845B; --warn:#C27A00; --bad:#C3313F;
  --f-display:"Saira Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Hiragino Sans","Noto Sans CJK TC","Noto Sans CJK JP","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1022; --panel:#151B33; --ink:#E9ECF7; --muted:#9AA2C0; --line:#2A3253;
  --accent:#7C93FF; --accent-ink:#0C1022; --done:#3CC48E; --warn:#F2B13A; --bad:#FF6B78; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1022; --panel:#151B33; --ink:#E9ECF7; --muted:#9AA2C0; --line:#2A3253;
  --accent:#7C93FF; --accent-ink:#0C1022; --done:#3CC48E; --warn:#F2B13A; --bad:#FF6B78; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:16px 48px;display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
h1{font-family:var(--f-display);font-weight:800;font-size:1.9rem;letter-spacing:.02em;margin:0;line-height:1.1;text-wrap:balance}
h1 small{display:block;font-family:var(--f-body);font-size:.8rem;font-weight:400;color:var(--muted);letter-spacing:0}
.lang{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.lang button{border:0;background:transparent;color:var(--muted);padding:6px 10px;font:inherit;font-size:.85rem;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
section{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
h2{font-family:var(--f-display);font-weight:600;font-size:1.25rem;letter-spacing:.04em;text-transform:uppercase;margin:0}
.clock{background:var(--ink);color:var(--bg);border:0;
  background-image:repeating-linear-gradient(90deg,transparent 0 10px,rgba(127,127,127,.12) 10px 20px);}
.clock .row{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between}
.big{font-family:var(--f-display);font-weight:800;font-size:2.6rem;line-height:1;font-variant-numeric:tabular-nums}
.lbl{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
.cd.warn{color:var(--warn)} .cd.bad{color:var(--bad)}
.status{font-size:.85rem;opacity:.9}
.tznote{font-size:.82rem;background:rgba(127,127,127,.18);border-radius:6px;padding:6px 8px}
label{font-size:.85rem;color:var(--muted);display:flex;flex-direction:column;gap:4px}
input[type=text],input[type=url],input[type=date],select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;box-sizing:border-box}
input:focus-visible,button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2>*{min-width:0}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;min-height:2.6em;line-height:1.3}
input[type=date]::-webkit-date-and-time-value{text-align:left}
@media (max-width:460px){.grid2{grid-template-columns:1fr}}
.plats{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
@media (max-width:420px){.plats{grid-template-columns:repeat(3,1fr)}}
.plat{border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);padding:10px 4px;font:inherit;font-weight:600;font-size:.85rem;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.plat .mk{font-size:.7rem;font-weight:400;color:var(--muted)}
.plat[aria-pressed="true"]{border-color:var(--done);background:var(--done);color:#fff}
.plat[aria-pressed="true"] .mk{color:#fff}
.tally{display:flex;gap:16px;flex-wrap:wrap;font-size:.9rem;color:var(--muted)}
.tally b{font-family:var(--f-display);font-size:1.5rem;color:var(--ink);font-variant-numeric:tabular-nums}
.btn{font:inherit;font-weight:600;border-radius:8px;padding:10px 14px;cursor:pointer;border:1.5px solid var(--accent);background:var(--accent);color:var(--accent-ink);text-decoration:none;text-align:center}
.btn.ghost{background:transparent;color:var(--accent)}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.drop{border:1.5px dashed var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px;align-items:stretch;min-width:0}
.drop img{border-radius:6px;max-height:160px;object-fit:contain;background:var(--bg)}
.drop span{font-size:.8rem;color:var(--muted)}
canvas{display:none}
#out{width:100%;border-radius:8px;border:1px solid var(--line)}
.hint{font-size:.82rem;color:var(--muted);margin:0}
pre{white-space:pre-wrap;word-break:break-all;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;margin:0;font:inherit;font-size:.9rem}
ul.rules{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;font-size:.9rem}
ul.rules li::marker{color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:.9rem}
input[type=range]{width:100%;accent-color:var(--accent)}
.done-ok{color:var(--done);font-weight:600}
</style>

<div class="wrap">
  <header>
    <h1>STAR TRACE <span style="color:var(--accent)">STREAMING</span>
      <small data-i="sub"></small></h1>
    <div class="lang" role="group" aria-label="Language">
      <button id="l-zh" data-l="zh">繁中</button><button id="l-ja" data-l="ja">日本語</button><button id="l-ko" data-l="ko">한국어</button><button id="l-en" data-l="en">EN</button>
    </div>
  </header>

  <section class="clock" aria-live="polite">
    <div class="row">
      <div><div class="lbl">KST</div><div class="big" id="kst">--:--:--</div></div>
      <div><div class="lbl" data-i="deadline"></div><div class="big cd" id="cd">--:--</div></div>
    </div>
    <div class="status" id="evstatus"></div>
    <div class="tznote" id="tznote" hidden></div>
  </section>

  <section>
    <h2 data-i="setup"></h2>
    <div class="grid2">
      <label><span data-i="xid"></span><input type="text" id="xid" placeholder="plave_official" autocomplete="off"></label>
      <label><span data-i="firstpost"></span><input type="url" id="post" placeholder="https://x.com/.../status/123..."></label>
    </div>
    <p class="hint" id="posthint"></p>
  </section>

  <section>
    <h2 data-i="board"></h2>
    <p class="hint" data-i="boardhint"></p>
    <div class="plats" id="plats"></div>
    <div class="tally">
      <span><span data-i="thishour"></span> <b id="hcount">0</b>/5</span>
      <span><span data-i="total"></span> <b id="tcount">0</b></span>
    </div>
  </section>

  <section>
    <h2 data-i="maker"></h2>
    <div class="grid2">
      <div class="drop"><span data-i="startshot"></span><input type="file" id="f1" accept="image/*"><img id="p1" alt="" hidden></div>
      <div class="drop"><span data-i="endshot"></span><input type="file" id="f2" accept="image/*"><img id="p2" alt="" hidden></div>
    </div>
    <div class="grid2">
      <label><span data-i="platform"></span><select id="plat"></select></label>
      <label><span data-i="date"></span><input type="date" id="date"></label>
    </div>
    <label><span data-i="pos"></span><input type="range" id="pos" min="15" max="85" value="52"></label>
    <canvas id="cv"></canvas>
    <img id="out" alt="" hidden>
    <p class="hint" id="savehint" hidden data-i="save"></p>
    <div class="btns" id="outbtns" hidden>
      <button class="btn" id="dlimg" data-i="dlimg"></button>
      <button class="btn ghost" id="shareboth" data-i="shareboth"></button>
      <button class="btn ghost" id="markdone" data-i="markdone"></button>
    </div>
  </section>

  <section>
    <h2 data-i="reply"></h2>
    <pre id="rtext"></pre>
    <div class="btns">
      <button class="btn" id="copytxt" data-i="copytxt"></button>
      <a class="btn ghost" id="intent" target="_blank" rel="noopener"></a>
    </div>
    <p class="hint" id="replyhint"></p>
  </section>

  <section>
    <h2 data-i="form"></h2>
    <p class="hint" data-i="formhint"></p>
    <div class="btns"><a class="btn ghost" href="https://forms.gle/adeHvU37s5ochofRA" target="_blank" rel="noopener">forms.gle/adeHvU37s5ochofRA</a></div>
  </section>

  <section>
    <h2 data-i="rules"></h2>
    <ul class="rules" id="rules"></ul>
  </section>
  <p class="hint" data-i="privacy"></p>
</div>
<div class="toast" id="toast" hidden></div>

const $=id=>document.getElementById(id);
const ls={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let lang=ls.get("st_lang",(navigator.language||"zh").slice(0,2));if(!T[lang])lang="zh";
let log=ls.get("st_log",{});
const pad=n=>String(n).padStart(2,"0");
const kst=()=>new Date(Date.now()+9*3600e3);
const hourKey=()=>{const d=kst();return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())} ${pad(d.getUTCHours())}`};
const kstDate=()=>{const d=kst();return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`};
function toast(m){const t=$("toast");t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,1800)}

function applyLang(){
  const L=T[lang];document.documentElement.lang=lang==="zh"?"zh-Hant":lang;
  document.querySelectorAll("[data-i]").forEach(e=>{const v=L[e.dataset.i];if(typeof v==="string")e.textContent=v});
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===lang));
  $("rules").innerHTML="";L.r.forEach(x=>{const li=document.createElement("li");li.textContent=x;$("rules").appendChild(li)});
  const off=-new Date().getTimezoneOffset()/60-9;const tz=$("tznote");
  if(off!==0){tz.hidden=false;tz.textContent=L.tz(off>0?"+"+off:off)}else tz.hidden=true;
  renderBoard();renderReply();tick();
}
function renderBoard(){
  const k=hourKey(),done=log[k]||[];const box=$("plats");box.innerHTML="";
  PL.forEach(p=>{const b=document.createElement("button");b.className="plat";b.id="pl-"+p;b.setAttribute("aria-pressed",done.includes(p));
    b.innerHTML=`<span></span><span class="mk">${done.includes(p)?"✓":"—"}</span>`;b.firstChild.textContent=p;
    b.onclick=()=>toggle(p);box.appendChild(b)});
  $("hcount").textContent=done.length;
  let total=0;for(const key in log)total+=log[key].length;$("tcount").textContent=total;
  const sel=$("plat");if(!sel.options.length){PL.forEach(p=>sel.add(new Option(p,p)));const last=ls.get("st_plat","");if(PL.includes(last))sel.value=last}
}
function toggle(p,force){
  const k=hourKey();const s=new Set(log[k]||[]);
  if(force===true||!s.has(p))s.add(p);else s.delete(p);
  log[k]=[...s];if(!log[k].length)delete log[k];ls.set("st_log",log);renderBoard();
}
let lastHour=hourKey();
function tick(){
  const d=kst();$("kst").textContent=`${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}:${pad(d.getUTCSeconds())}`;
  const left=59*60-(d.getUTCMinutes()*60+d.getUTCSeconds());const cd=$("cd");
  if(left>0){cd.textContent=`${pad(Math.floor(left/60))}:${pad(left%60)}`}else{cd.textContent="00:00"}
  cd.className="big cd"+(left<=0?" bad":left<=300?" warn":"");
  const now=Date.now(),L=T[lang];$("evstatus").textContent=now<EV_START?L.before:now>EV_END?L.after:L.during;
  if(hourKey()!==lastHour){lastHour=hourKey();renderBoard()}
}
setInterval(tick,1000);

// settings
$("xid").value=ls.get("st_xid","");$("post").value=ls.get("st_post","");
function postId(){const m=($("post").value||"").match(/status\/(\d+)/);return m?m[1]:null}
function postUser(){const m=($("post").value||"").match(/(?:x|twitter)\.com\/([A-Za-z0-9_]+)\/status\//);return m?m[1]:"i"}
// iOS: X app doesn't claim /intent/ links, so Safari opens them (often logged out, text lost) — go to the app instead
const IOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
function renderReply(){
  const L=T[lang];const id=$("xid").value.trim().replace(/^@/,"");
  const txt=`${$("plat").value||PL[0]} 「Star Trace」 ${($("date").value||kstDate()).replace(/-/g,".")}\n${TAGS}`;
  $("rtext").textContent=txt;
  const pid=postId();const a=$("intent");
  if(IOS){
    a.href=pid?`https://x.com/${postUser()}/status/${pid}`:"twitter://post?message="+encodeURIComponent(txt);
    if(pid)a.target="_blank";else a.removeAttribute("target");
  }else a.href="https://x.com/intent/post?text="+encodeURIComponent(txt)+(pid?"&in_reply_to="+pid:"");
  a.textContent=pid?L.openx:L.openfirst;
  $("replyhint").textContent=IOS?(pid?L.replyios:L.firstios):(pid?L.replyhint:L.firsthint);
  $("posthint").textContent=pid?L.postok:L.nopost;$("posthint").className="hint"+(pid?" done-ok":"");
}
$("xid").addEventListener("input",()=>{ls.set("st_xid",$("xid").value.trim().replace(/^@/,""));draw();renderReply()});
$("post").addEventListener("input",()=>{ls.set("st_post",$("post").value.trim());renderReply()});
$("plat").addEventListener("change",()=>{ls.set("st_plat",$("plat").value);renderReply()});
$("date").value=kstDate();
$("date").addEventListener("change",()=>{draw();renderReply()});
$("pos").addEventListener("input",draw);

// image maker
const imgs=[null,null];
function load(i){
  const f=$("f"+(i+1)).files[0];if(!f)return;const url=URL.createObjectURL(f);const im=new Image();
  im.onload=()=>{imgs[i]=im;const p=$("p"+(i+1));p.src=url;p.hidden=false;draw()};im.src=url;
}
$("f1").addEventListener("change",()=>load(0));$("f2").addEventListener("change",()=>load(1));
let outBlob=null;
function draw(){
  if(!imgs[0]||!imgs[1])return;
  const id=$("xid").value.trim().replace(/^@/,"");
  if(!id){toast(T[lang].noid);return}
  const h=Math.min(imgs[0].naturalHeight,imgs[1].naturalHeight,2400);
  const w0=Math.round(imgs[0].naturalWidth*h/imgs[0].naturalHeight),w1=Math.round(imgs[1].naturalWidth*h/imgs[1].naturalHeight);
  const cv=$("cv");cv.width=w0+w1;cv.height=h;const c=cv.getContext("2d");
  c.drawImage(imgs[0],0,0,w0,h);c.drawImage(imgs[1],w0,0,w1,h);
  const text=`${id} / ${$("date").value.replace(/-/g,".")}`;
  let fs=Math.round(cv.width*0.045);c.font=`800 ${fs}px "IBM Plex Sans",system-ui,sans-serif`;
  while(c.measureText(text).width>cv.width*0.9&&fs>10){fs--;c.font=`800 ${fs}px "IBM Plex Sans",system-ui,sans-serif`}
  const y=h*($("pos").value/100);c.textAlign="center";c.textBaseline="middle";
  c.lineJoin="round";c.lineWidth=Math.max(3,fs*0.18);c.strokeStyle="#000";c.strokeText(text,cv.width/2,y);
  c.fillStyle="#fff";c.fillText(text,cv.width/2,y);
  cv.toBlob(b=>{outBlob=b;const o=$("out");if(o.src)URL.revokeObjectURL(o.src);o.src=URL.createObjectURL(b);o.hidden=false;$("savehint").hidden=false;$("outbtns").hidden=false},"image/png");
}
function imgName(){const d=kst();return `StarTrace_${$("plat").value}_${$("date").value.replace(/-/g,"")}_${pad(d.getUTCHours())}${pad(d.getUTCMinutes())}.png`}
$("dlimg").onclick=async()=>{
  const L=T[lang];if(!outBlob)return toast(L.need2);
  const name=imgName();
  // Mobile: share sheet lets iPhone users pick "Save Image" (goes to Photos; <a download> lands in Files)
  const file=new File([outBlob],name,{type:"image/png"});
  if(matchMedia("(pointer:coarse)").matches&&navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file]})}catch(e){if(e&&e.name!=="AbortError")toast(L.save)}
    return;
  }
  let dl=null;
  if(window.claude&&window.claude.use){try{dl=await window.claude.use("downloads")}catch(e){dl=null}}
  if(dl){
    try{await dl.save({filename:name,data:outBlob});toast(L.saved)}
    catch(e){if(e&&e.code!=="declined")toast(L.save)}
    return;
  }
  if(window.self!==window.top){toast(L.save);return}
  const a=document.createElement("a");a.href=URL.createObjectURL(outBlob);a.download=name;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast(L.saved);
};
// Image + reply text in one share; whether the target (X, Copy) keeps both is up to that app
$("shareboth").onclick=async()=>{
  const L=T[lang];if(!outBlob)return toast(L.need2);
  const data={files:[new File([outBlob],imgName(),{type:"image/png"})],text:$("rtext").textContent};
  if(!(navigator.canShare&&navigator.canShare(data)))return toast(L.noshare);
  try{await navigator.share(data)}catch(e){if(e&&e.name!=="AbortError")toast(L.noshare)}
};
$("markdone").onclick=()=>{const p=$("plat").value;toggle(p,true);toast(T[lang].marked(p))};
$("intent").addEventListener("click",()=>{if(IOS)try{navigator.clipboard.writeText($("rtext").textContent)}catch(e){}});
$("copytxt").onclick=()=>{
  const t=$("rtext").textContent;
  try{navigator.clipboard.writeText(t).then(()=>toast(T[lang].copied),sel)}catch(e){sel()}
  function sel(){const r=document.createRange();r.selectNodeContents($("rtext"));const s=getSelection();s.removeAllRanges();s.addRange(r);toast(T[lang].copyfail)}
};
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{lang=b.dataset.l;ls.set("st_lang",lang);applyLang()});
applyLang();
</script>
