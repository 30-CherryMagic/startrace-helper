<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>HYPERDRIVE 認證助手</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;800&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
/* Layout: one narrow "pit board" column — event tabs, clock strip, then per-event setup, image maker, post text, rules */
:root{
  --bg:#EEF1F6; --panel:#FFFFFF; --ink:#111733; --muted:#5B6382; --line:#D7DCE8;
  --accent:#2B4EF0; --accent-ink:#FFFFFF; --done:#11845B; --warn:#C27A00; --bad:#C3313F;
  --f-display:"Saira Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Hiragino Sans","Noto Sans CJK TC","Noto Sans CJK JP","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1022; --panel:#151B33; --ink:#E9ECF7; --muted:#9AA2C0; --line:#2A3253;
  --accent:#7C93FF; --accent-ink:#0C1022; --done:#3CC48E; --warn:#F2B13A; --bad:#FF6B78; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1022; --panel:#151B33; --ink:#E9ECF7; --muted:#9AA2C0; --line:#2A3253;
  --accent:#7C93FF; --accent-ink:#0C1022; --done:#3CC48E; --warn:#F2B13A; --bad:#FF6B78; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:16px 48px;display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-direction:column;gap:8px}
h1{font-family:var(--f-display);font-weight:800;font-size:1.9rem;letter-spacing:.02em;margin:0;line-height:1.1;text-wrap:balance}
h1 small{display:block;font-family:var(--f-body);font-size:.8rem;font-weight:400;color:var(--muted);letter-spacing:0}
.lang{display:flex;align-self:flex-end;order:-1;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.lang button{border:0;background:transparent;color:var(--muted);padding:6px 10px;font:inherit;font-size:.85rem;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
section{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
h2{font-family:var(--f-display);font-weight:600;font-size:1.25rem;letter-spacing:.04em;text-transform:uppercase;margin:0}
.clock{background:var(--ink);color:var(--bg);border:0;
  background-image:repeating-linear-gradient(90deg,transparent 0 10px,rgba(127,127,127,.12) 10px 20px);}
.clock .row{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between}
.big{font-family:var(--f-display);font-weight:800;font-size:2.6rem;line-height:1;font-variant-numeric:tabular-nums}
.lbl{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
.cd.warn{color:var(--warn)} .cd.bad{color:var(--bad)}
.status{font-size:.85rem;opacity:.9}
.tznote{font-size:.82rem;background:rgba(127,127,127,.18);border-radius:6px;padding:6px 8px}
label{font-size:.85rem;color:var(--muted);display:flex;flex-direction:column;gap:4px}
input[type=text],input[type=url],input[type=date],select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;box-sizing:border-box}
input:focus-visible,button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2>*{min-width:0}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;min-height:2.6em;line-height:1.3}
input[type=date]::-webkit-date-and-time-value{text-align:left}
@media (max-width:460px){.grid2{grid-template-columns:1fr}}
.btn{font:inherit;font-weight:600;border-radius:8px;padding:10px 14px;cursor:pointer;border:1.5px solid var(--accent);background:var(--accent);color:var(--accent-ink);text-decoration:none;text-align:center}
.btn.ghost{background:transparent;color:var(--accent)}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.drop{border:1.5px dashed var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px;align-items:stretch;min-width:0}
.drop img{border-radius:6px;max-height:160px;object-fit:contain;background:var(--bg)}
.drop span{font-size:.8rem;color:var(--muted)}
#out,#lout{width:100%;border-radius:8px;border:1px solid var(--line)}
.hint{font-size:.82rem;color:var(--muted);margin:0}
pre{white-space:pre-wrap;word-break:break-all;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;margin:0;font:inherit;font-size:.9rem}
ul.rules{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;font-size:.9rem}
ul.rules li::marker{color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:.9rem}
input[type=range]{width:100%;accent-color:var(--accent)}
.done-ok{color:var(--done);font-weight:600}
.tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px}
.tabs button{flex:1;border:0;background:transparent;color:var(--muted);font:inherit;font-weight:600;padding:8px 6px;border-radius:7px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.tabpanel{display:flex;flex-direction:column;gap:16px}
.alert{margin:0;font-size:.78rem;font-weight:600;color:var(--bad)}
.chk{display:flex;flex-direction:column;gap:6px;margin:0;padding:10px;border-radius:8px;background:var(--bg);border:1px solid var(--line)}
.chk p{margin:0;font-size:.85rem;color:var(--muted)}
.chk label{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-size:.92rem;cursor:pointer}
.chk input{width:18px;height:18px;margin:0;accent-color:var(--done)}
.chk.ok{border-color:var(--done)}
.chk.ok p{color:var(--done);font-weight:600}
</style>

<div class="wrap">
  <header>
    <h1><span id="h1a">STAR TRACE</span> <span id="h1b" style="color:var(--accent)">STREAMING</span>
      <small id="sub"></small></h1>
    <div class="lang" role="group" aria-label="Language">
      <button id="l-zh" data-l="zh">繁中</button><button id="l-ja" data-l="ja">日本語</button><button id="l-ko" data-l="ko">한국어</button><button id="l-en" data-l="en">EN</button>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" id="tab-st-btn" data-tab="st" data-i="tabst"></button><button role="tab" id="tab-lp-btn" data-tab="lp" data-i="tablp"></button>
  </nav>

  <section class="clock" aria-live="polite">
    <div class="row">
      <div><div class="lbl">KST</div><div class="big" id="kst">--:--:--</div></div>
      <div><div class="lbl" id="deadline"></div><div class="big cd" id="cd">--:--</div></div>
    </div>
    <div class="status" id="evstatus"></div>
    <div class="tznote" id="tznote" hidden></div>
  </section>

  <div class="tabpanel" id="tab-st">
  <section>
    <h2 data-i="setup"></h2>
    <div class="grid2">
      <label><span data-i="xid"></span><input type="text" id="xid" placeholder="plave_official" autocomplete="off"></label>
      <label><span data-i="firstpost"></span><input type="url" id="post" placeholder="https://x.com/.../status/123..."></label>
    </div>
    <p class="hint" id="posthint"></p>
  </section>

  <section>
    <h2 data-i="maker"></h2>
    <div class="grid2">
      <div class="drop"><span data-i="startshot"></span><input type="file" id="f1" accept="image/*"><img id="p1" alt="" hidden></div>
      <div class="drop"><span data-i="endshot"></span><input type="file" id="f2" accept="image/*"><img id="p2" alt="" hidden></div>
    </div>
    <div class="grid2">
      <label><span data-i="platform"></span><select id="plat"></select></label>
      <label><span data-i="date"></span><input type="date" id="date"></label>
    </div>
    <label><span data-i="pos"></span><input type="range" id="pos" min="15" max="85" value="52"></label>
    <label><span data-i="wm"></span><input type="range" id="wm" min="0" max="40" value="15"></label>
    <img id="out" alt="" hidden>
    <p class="hint" id="savehint" hidden data-i="save"></p>
  </section>

  <section>
    <h2 data-i="reply"></h2>
    <pre id="rtext"></pre>
    <div class="btns">
      <button class="btn" id="copytxt" data-i="copytxt"></button>
      <a class="btn ghost" id="openpost" target="_blank" rel="noopener"></a>
    </div>
    <p class="hint" id="replyhint"></p>
  </section>

  <section>
    <h2 data-i="form"></h2>
    <p class="hint" data-i="formhint"></p>
    <div class="btns"><a class="btn ghost" href="https://forms.gle/adeHvU37s5ochofRA" target="_blank" rel="noopener">forms.gle/adeHvU37s5ochofRA</a></div>
  </section>

  <section>
    <h2 data-i="rules"></h2>
    <ul class="rules" id="rules"></ul>
  </section>
  </div>

  <div class="tabpanel" id="tab-lp" hidden>
  <section>
    <h2 data-i="setup"></h2>
    <label><span data-i="wvnick"></span><input type="text" id="wvnick" autocomplete="off"></label>
    <p class="alert" data-i="lpmail"></p>
    <label><span data-i="lpround"></span><select id="lpn"></select></label>
    <p class="hint" data-i="lpvary"></p>
  </section>

  <section>
    <h2 data-i="maker"></h2>
    <div class="drop"><span data-i="lpshot"></span><input type="file" id="lf" accept="image/*"><img id="lp1" alt="" hidden></div>
    <div class="chk" id="lpchk"><p data-i="lpchk"></p></div>
    <label><span data-i="lppos"></span><input type="range" id="lpos" min="5" max="95" value="50"></label>
    <label><span data-i="wm"></span><input type="range" id="lwm" min="0" max="40" value="15"></label>
    <img id="lout" alt="" hidden>
    <p class="hint" id="lsavehint" hidden data-i="lpsave"></p>
  </section>

  <section>
    <h2 data-i="lppost"></h2>
    <pre id="ltext"></pre>
    <div class="btns">
      <button class="btn" id="lcopy" data-i="copytxt"></button>
      <a class="btn ghost" href="https://weverse.io/plave/feed" target="_blank" rel="noopener" data-i="lpopen"></a>
    </div>
    <p class="hint" data-i="lphint"></p>
  </section>

  <section>
    <h2 data-i="rules"></h2>
    <ul class="rules" id="lrules"></ul>
  </section>
  </div>
  <p class="hint" data-i="privacy"></p>
</div>
<div class="toast" id="toast" hidden></div>

const $=id=>document.getElementById(id);
const ls={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let lang=ls.get("st_lang",(navigator.language||"zh").slice(0,2));if(!T[lang])lang="zh";
const pad=n=>String(n).padStart(2,"0");
const kst=()=>new Date(Date.now()+9*3600e3);
const kstDate=()=>{const d=kst();return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`};
function toast(m){const t=$("toast");t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,1800)}

function applyLang(){
  const L=T[lang];document.documentElement.lang=lang==="zh"?"zh-Hant":lang;
  document.querySelectorAll("[data-i]").forEach(e=>{const v=L[e.dataset.i];if(typeof v==="string")e.textContent=v});
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===lang));
  [["rules",L.r],["lrules",L.lpr]].forEach(([id,list])=>{$(id).innerHTML="";list.forEach(x=>{const li=document.createElement("li");li.textContent=x;$(id).appendChild(li)})});
  [...$("lpn").options].forEach((o,i)=>o.textContent=`${L.round(i+1)}  ${kstLabel(LP_START[i])}`);
  $("lpchk").querySelectorAll("label span").forEach((e,i)=>e.textContent=L.lpc[i]);
  const off=-new Date().getTimezoneOffset()/60-9;const tz=$("tznote");
  if(off!==0){tz.hidden=false;tz.textContent=L.tz(off>0?"+"+off:off)}else tz.hidden=true;
  renderReply();renderLp();applyTab();
}
const sel=$("plat");PL.forEach(p=>sel.add(new Option(p,p)));{const last=ls.get("st_plat","");if(PL.includes(last))sel.value=last}
const kstLabel=t=>{const d=new Date(t+9*3600e3);return `${d.getUTCMonth()+1}/${d.getUTCDate()} ${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}`};
const kstDay=t=>new Date(t+9*3600e3).toISOString().slice(0,10);
function tick(){
  const d=kst();$("kst").textContent=`${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}:${pad(d.getUTCSeconds())}`;
  const now=Date.now(),L=T[lang],cd=$("cd");
  if(tab==="lp"){
    lpSync();
    // Today's round (if any): before start → status only; after start → countdown to 23:59:59 KST
    const i=LP_START.findIndex(t=>kstDay(t)===kstDate());
    if(i>=0&&now>=LP_START[i]){
      const left=Math.max(0,24*3600-1-(d.getUTCHours()*3600+d.getUTCMinutes()*60+d.getUTCSeconds()));
      cd.textContent=`${Math.floor(left/3600)}:${pad(Math.floor(left/60)%60)}:${pad(left%60)}`;
      cd.className="big cd"+(left<=0?" bad":left<=1800?" warn":"");$("evstatus").textContent=L.lpduring(i+1);
    }else{
      cd.textContent="--:--";cd.className="big cd";
      const j=LP_START.findIndex(t=>t>now);
      $("evstatus").textContent=i>=0?L.lpbefore(i+1,kstLabel(LP_START[i]).split(" ")[1]):j>=0?L.lpnext(j+1,kstLabel(LP_START[j])):L.lpafter;
    }
    return;
  }
  const left=59*60-(d.getUTCMinutes()*60+d.getUTCSeconds());
  if(left>0){cd.textContent=`${pad(Math.floor(left/60))}:${pad(left%60)}`}else{cd.textContent="00:00"}
  cd.className="big cd"+(left<=0?" bad":left<=300?" warn":"");
  $("evstatus").textContent=now<EV_START?L.before:now>EV_END?L.after:L.during;
}
setInterval(tick,1000);

// settings
$("xid").value=ls.get("st_xid","");$("post").value=ls.get("st_post","");
function postId(){const m=($("post").value||"").match(/status\/(\d+)/);return m?m[1]:null}
function postUser(){const m=($("post").value||"").match(/(?:x|twitter)\.com\/([A-Za-z0-9_]+)\/status\//);return m?m[1]:"i"}
const MOBILE=matchMedia("(pointer:coarse)").matches;
function renderReply(){
  const L=T[lang];const id=$("xid").value.trim().replace(/^@/,"");
  const txt=`${$("plat").value||PL[0]} 「Star Trace」 ${($("date").value||kstDate()).replace(/-/g,".")}\n${TAGS}`;
  $("rtext").textContent=txt;
  // Status links open in the X app on phones (intent links don't), so open the first post and let the user paste
  const pid=postId();const a=$("openpost");a.textContent=pid?L.openx:L.needpost;
  // Desktop has no useful share sheet: use the plain X post intent there (image is pasted by hand)
  if(pid)a.href=`https://x.com/${postUser()}/status/${pid}`;
  else if(!MOBILE)a.href="https://x.com/intent/post?text="+encodeURIComponent(txt);
  else a.removeAttribute("href");
  $("replyhint").textContent=pid?L.replyhint:MOBILE?L.firsthint:L.firsthintpc;
  $("posthint").textContent=pid?L.postok:L.nopost;$("posthint").className="hint"+(pid?" done-ok":"");
}
$("xid").addEventListener("input",()=>{ls.set("st_xid",$("xid").value.trim().replace(/^@/,""));draw();renderReply()});
$("post").addEventListener("input",()=>{ls.set("st_post",$("post").value.trim());renderReply()});
// Text height and watermark strength are remembered per platform (each app's screenshot layout differs)
let adj=ls.get("st_adj",{});
function loadAdj(){const a=adj[$("plat").value]||{};$("pos").value=a.pos??52;$("wm").value=a.wm??15}
function saveAdj(){adj[$("plat").value]={pos:+$("pos").value,wm:+$("wm").value};ls.set("st_adj",adj)}
loadAdj();
$("plat").addEventListener("change",()=>{ls.set("st_plat",$("plat").value);loadAdj();draw();renderReply()});
$("date").value=kstDate();
$("date").addEventListener("change",()=>{draw();renderReply()});
$("pos").addEventListener("input",()=>{saveAdj();draw()});$("wm").addEventListener("input",()=>{saveAdj();draw()});

// image maker
const imgs=[null,null];
function load(i){
  const f=$("f"+(i+1)).files[0];if(!f)return;const url=URL.createObjectURL(f);const im=new Image();
  im.onload=()=>{imgs[i]=im;const p=$("p"+(i+1));p.src=url;p.hidden=false;draw()};im.src=url;
}
$("f1").addEventListener("change",()=>load(0));$("f2").addEventListener("change",()=>load(1));
let outBlob=null;
function draw(){
  if(!imgs[0]||!imgs[1])return;
  const id=$("xid").value.trim().replace(/^@/,"");
  if(!id){toast(T[lang].noid);return}
  const cv=compose(imgs,`${id} / ${$("date").value.replace(/-/g,".")}`,$("pos").value,$("wm").value);
  cv.toBlob(b=>{outBlob=b;const o=$("out");if(o.src)URL.revokeObjectURL(o.src);o.src=URL.createObjectURL(b);o.hidden=false;$("savehint").hidden=false},"image/png");
}
// Screenshots side by side at a common height, tiled watermark, then the main ID/date line
function compose(list,text,posPct,wmPct){
  const h=Math.min(...list.map(im=>im.naturalHeight),2400);
  const ws=list.map(im=>Math.round(im.naturalWidth*h/im.naturalHeight));
  const cv=document.createElement("canvas");cv.width=ws.reduce((a,b)=>a+b,0);cv.height=h;const c=cv.getContext("2d");
  let x=0;list.forEach((im,i)=>{c.drawImage(im,x,0,ws[i],h);x+=ws[i]});
  let fs=Math.round(cv.width/list.length*0.09);c.font=`800 ${fs}px "IBM Plex Sans",system-ui,sans-serif`;
  while(c.measureText(text).width>cv.width*0.9&&fs>10){fs--;c.font=`800 ${fs}px "IBM Plex Sans",system-ui,sans-serif`}
  // Tiled diagonal watermark, faint enough that the player text underneath stays readable
  const wa=wmPct/100;
  if(wa>0){
    const wfs=Math.max(12,Math.round(fs*0.55));c.save();c.globalAlpha=wa;
    c.font=`600 ${wfs}px "IBM Plex Sans",system-ui,sans-serif`;c.textAlign="center";c.textBaseline="middle";
    c.lineJoin="round";c.lineWidth=Math.max(1,wfs*0.08);c.strokeStyle="#000";c.fillStyle="#fff";
    c.translate(cv.width/2,h/2);c.rotate(-Math.PI/6);
    const D=Math.hypot(cv.width,h)/2,sx=c.measureText(text).width+wfs*3,sy=wfs*4;
    for(let yy=-D,row=0;yy<=D;yy+=sy,row++)for(let xx=-D-(row%2?sx/2:0);xx<=D+sx;xx+=sx){c.strokeText(text,xx,yy);c.fillText(text,xx,yy)}
    c.restore();
  }
  c.font=`800 ${fs}px "IBM Plex Sans",system-ui,sans-serif`;
  const y=h*(posPct/100);c.textAlign="center";c.textBaseline="middle";
  c.lineJoin="round";c.lineWidth=Math.max(3,fs*0.18);c.strokeStyle="#000";c.strokeText(text,cv.width/2,y);
  c.fillStyle="#fff";c.fillText(text,cv.width/2,y);
  return cv;
}
// No first post yet: share the image via the share sheet (X keeps the image, may drop text), so copy the text alongside
$("openpost").addEventListener("click",e=>{
  if(postId())return;
  // Desktop: intent links can't carry images, so put the image on the clipboard and let the link open X
  if(!MOBILE){
    if(outBlob&&window.ClipboardItem&&navigator.clipboard&&navigator.clipboard.write)
      navigator.clipboard.write([new ClipboardItem({"image/png":outBlob})]).then(()=>toast(T[lang].imgcopied),()=>{});
    return;
  }
  e.preventDefault();const L=T[lang];if(!outBlob)return toast(L.need2);
  const text=$("rtext").textContent;try{navigator.clipboard.writeText(text)}catch(_){}
  const data={files:[new File([outBlob],"StarTrace.png",{type:"image/png"})],text};
  const share=navigator.canShare&&navigator.canShare(data)?data:navigator.canShare&&navigator.canShare({files:data.files})?{files:data.files}:null;
  if(!share)return toast(L.noshare);
  navigator.share(share).catch(err=>{if(err&&err.name!=="AbortError")toast(L.noshare)});
});

{const k=LP_START.findIndex((_,i)=>lpOpen(i));$("lpn").value=k>=0?k+1:LP_START.length}
